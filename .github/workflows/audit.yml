name: Security Audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: security-audit
  # Two overlapping runs would both push a fixed Cargo.lock and race each other.
  cancel-in-progress: false

permissions: {}

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --features=fix

      - name: Run audit
        id: audit
        shell: bash
        run: bash scripts/security-audit.sh

      - name: Stage audit fix
        if: ${{ steps.audit.outputs.changed == 'true' }}
        run: git add Cargo.lock

      - name: Commit fixed Cargo.lock
        if: ${{ steps.audit.outputs.changed == 'true' }}
        uses: qoomon/actions--create-commit@7102b1a8b3cb8716dc70dbeb6d774c375d779d2f # v1.2.5
        with:
          message: 'fix(deps): resolve audit advisories'
          skip-empty: true

      - name: Push audit fix
        if: ${{ steps.audit.outputs.changed == 'true' }}
        run: git push

      - name: Create issue
        if: ${{ steps.audit.outputs.unresolved == 'true' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_REPORT: ${{ steps.audit.outputs.report }}
        with:
          filename: .github/security-advisory-issue.md
          assignees: ${{ github.repository_owner }}
          search_existing: open
          update_existing: true

      - name: Find advisory issue
        id: advisory_issue
        if: ${{ steps.audit.outputs.unresolved == 'false' }}
        uses: micalevisk/last-issue-action@0d40124cc99ac8601c2516007f0c98ef3d27537b # v2.3.0
        with:
          labels: security-advisory
          state: open

      - name: Close advisory issue
        if: ${{ steps.audit.outputs.unresolved == 'false' && steps.advisory_issue.outputs.has-found == 'true' }}
        uses: peter-evans/close-issue@05dff7ca07116e5707cfb3a3cd4af7bb5e43524c # v3.0.2
        with:
          issue-number: ${{ steps.advisory_issue.outputs.issue-number }}
          comment: '`cargo audit` no longer reports advisories.'

  images:
    name: Audit published images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan published image (:latest)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ahe-ics:latest
          format: json
          output: trivy-latest.json
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan published image (:alpine)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ahe-ics:alpine
          format: json
          output: trivy-alpine.json
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan published image (:shared)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ahe-ics:shared
          format: json
          output: trivy-shared.json
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan published image (:shared-alpine)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ahe-ics:shared-alpine
          format: json
          output: trivy-shared-alpine.json
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Aggregate findings
        id: images
        shell: bash
        run: bash scripts/image-audit.sh latest=trivy-latest.json alpine=trivy-alpine.json shared=trivy-shared.json shared-alpine=trivy-shared-alpine.json

      - name: Create issue
        if: ${{ steps.images.outputs.unresolved == 'true' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_REPORT: ${{ steps.images.outputs.report }}
        with:
          filename: .github/image-advisory-issue.md
          assignees: ${{ github.repository_owner }}
          search_existing: open
          update_existing: true

      - name: Find image advisory issue
        id: image_issue
        if: ${{ steps.images.outputs.unresolved == 'false' }}
        uses: micalevisk/last-issue-action@0d40124cc99ac8601c2516007f0c98ef3d27537b # v2.3.0
        with:
          labels: image-advisory
          state: open

      - name: Close image advisory issue
        if: ${{ steps.images.outputs.unresolved == 'false' && steps.image_issue.outputs.has-found == 'true' }}
        uses: peter-evans/close-issue@05dff7ca07116e5707cfb3a3cd4af7bb5e43524c # v3.0.2
        with:
          issue-number: ${{ steps.image_issue.outputs.issue-number }}
          comment: 'Trivy no longer reports fixable advisories in the published images.'
