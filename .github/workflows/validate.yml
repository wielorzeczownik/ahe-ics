name: Validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.+)$
  ACTIONLINT_VERSION: 1.7.12
  # renovate: datasource=npm depName=prettier
  PRETTIER_VERSION: 3.9.10

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust: &rust
              - '.github/workflows/validate.yml'
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - '.clippy.toml'
            dockerfiles:
              - '.github/workflows/validate.yml'
              - '.hadolint.yaml'
              - 'Dockerfile'
              - 'Dockerfile.alpine'
              - 'Dockerfile.release'
              - 'Dockerfile.alpine.release'
            docker:
              - *rust
              - 'Dockerfile'
              - 'Dockerfile.alpine'
              - '.dockerignore'
            shell:
              - '.github/workflows/validate.yml'
              - 'scripts/**'
            markdown:
              - '.github/workflows/validate.yml'
              - '**/*.md'
            workflows:
              - '.github/workflows/**'
            format:
              - '.github/workflows/validate.yml'
              - '.prettierrc'
              - '.prettierignore'
              - '**/*.json'
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'

      - name: Lint Dockerfile
        if: ${{ !cancelled() && steps.filter.outputs.dockerfiles == 'true' }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Lint Dockerfile.alpine
        if: ${{ !cancelled() && steps.filter.outputs.dockerfiles == 'true' }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.alpine

      - name: Lint Dockerfile.release
        if: ${{ !cancelled() && steps.filter.outputs.dockerfiles == 'true' }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.release

      - name: Lint Dockerfile.alpine.release
        if: ${{ !cancelled() && steps.filter.outputs.dockerfiles == 'true' }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.alpine.release

      - name: Install shfmt and shellcheck
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: shfmt,shellcheck

      - name: Format check shell scripts
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        run: shfmt --diff scripts/

      - name: Lint shell scripts
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        run: shellcheck scripts/*.sh

      - name: Lint workflows
        if: ${{ !cancelled() && steps.filter.outputs.workflows == 'true' }}
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: ${{ env.ACTIONLINT_VERSION }}
          shellcheck: true

      - name: Format check
        if: ${{ !cancelled() && steps.filter.outputs.format == 'true' }}
        run: npx --yes "prettier@${PRETTIER_VERSION}" --check .

      - name: Lint Markdown
        if: ${{ !cancelled() && steps.filter.outputs.markdown == 'true' }}
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !CHANGELOG.md

  tests:
    name: Tests
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cargo test
        run: cargo test --locked

  clippy:
    name: Clippy
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  image:
    name: Image ${{ matrix.variant }}
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.docker == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: dedicated
            dockerfile: Dockerfile
            tag: ahe-ics:test
          - variant: shared
            dockerfile: Dockerfile
            build_args: BIN=ahe-ics-shared
            tag: ahe-ics:shared-test
          - variant: alpine
            dockerfile: Dockerfile.alpine
            tag: ahe-ics:alpine-test
          - variant: alpine-shared
            dockerfile: Dockerfile.alpine
            build_args: BIN=ahe-ics-shared
            tag: ahe-ics:alpine-shared-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: false
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: json
          output: trivy-${{ matrix.variant }}.json
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Report vulnerabilities
        shell: bash
        env:
          REPORT: trivy-${{ matrix.variant }}.json
          VARIANT: ${{ matrix.variant }}
        run: |
          set -uo pipefail
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$REPORT")
          if [[ "$count" -eq 0 ]]; then
            echo "No fixable CRITICAL or HIGH vulnerabilities in $VARIANT."
            exit 0
          fi
          echo "::warning title=trivy::$count fixable CRITICAL/HIGH vulnerabilities in $VARIANT, see the job summary. Not blocking this pull request."
          {
            echo "### Trivy findings for $VARIANT"
            echo
            echo "Remediation is a base image digest bump, which Renovate raises separately."
            echo
            echo '```text'
            jq -r '
              .Results[]?.Vulnerabilities[]?
              | "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix")"
            ' "$REPORT" | sort -u
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
