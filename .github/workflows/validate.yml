name: Validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docker: ${{ steps.filter.outputs.docker }}
      deps: ${{ steps.filter.outputs.deps }}
      shell: ${{ steps.filter.outputs.shell }}
      markdown: ${{ steps.filter.outputs.markdown }}
      format: ${{ steps.filter.outputs.format }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4.0.2
        with:
          filters: |
            rust: &rust
              - '.github/workflows/validate.yml'
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - '.clippy.toml'
            docker:
              - *rust
              - 'Dockerfile'
              - 'Dockerfile.shared'
              - '.dockerignore'
            deps:
              - '.github/workflows/validate.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
            shell:
              - '.github/workflows/validate.yml'
              - 'scripts/**'
            markdown:
              - '.github/workflows/validate.yml'
              - '**/*.md'
            format:
              - '.github/workflows/validate.yml'
              - '.prettierrc'
              - '.prettierignore'
              - '**/*.json'
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'

  cargo-test:
    name: Cargo test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1

      - name: Cargo test
        run: cargo test --locked

  lint:
    name: Lint (clippy + rustfmt)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  cargo-audit:
    name: Cargo audit
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.84.0
        with:
          tool: cargo-audit

      - name: Cargo audit
        shell: bash
        run: |
          set -uo pipefail
          if cargo audit | tee audit.log; then
            exit 0
          fi
          echo "::warning title=cargo audit::Advisories found – see the job summary. Not blocking this pull request."
          {
            echo "### cargo audit findings"
            echo
            echo '```text'
            cat audit.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  smoke-build:
    name: Smoke build (${{ matrix.variant }})
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: dedicated
            dockerfile: Dockerfile
            tag: ahe-ics:test
          - variant: shared
            dockerfile: Dockerfile.shared
            tag: ahe-ics:shared-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  shfmt:
    name: shfmt
    needs: changes
    if: ${{ needs.changes.outputs.shell == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up shfmt
        uses: mfinelli/setup-shfmt@v4.0.1

      - name: Format check shell scripts
        run: shfmt --diff scripts/

  prettier:
    name: Prettier
    needs: changes
    if: ${{ needs.changes.outputs.format == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Format check
        run: npx --yes prettier@3.9.6 --check .

  markdownlint:
    name: markdownlint
    needs: changes
    if: ${{ needs.changes.outputs.markdown == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.1.0
        with:
          globs: |
            **/*.md
            !CHANGELOG.md
