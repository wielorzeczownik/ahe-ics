name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile.release'
      - 'Dockerfile.alpine.release'
      - 'scripts/**'

concurrency:
  group: release-main
  # Never cancel a release in flight: prepare-release pushes the tag before the
  # artifacts exist, so a cancelled run would strand that tag with no GitHub
  # release and no images, and no later run would rebuild it.
  cancel-in-progress: false

permissions: {}

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      commit_changes: ${{ steps.bump.outputs.commit_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-edit

      - name: Determine next version (git-cliff)
        id: cliff_bumped
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --bumped-version
        env:
          OUTPUT: bumped-version.txt
          GITHUB_REPO: ${{ github.repository }}

      - name: Bump project version
        id: bump
        shell: bash
        env:
          CLIFF_BUMPED_VERSION: ${{ steps.cliff_bumped.outputs.content }}
        run: bash scripts/bump-version.sh

      - name: Generate release notes (git-cliff)
        if: ${{ steps.bump.outputs.released == 'true' }}
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff-release.toml
          args: --unreleased --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate CHANGELOG.md (git-cliff)
        if: ${{ steps.bump.outputs.released == 'true' }}
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Stage release files
        if: ${{ steps.bump.outputs.released == 'true' && steps.bump.outputs.commit_changes == 'true' }}
        run: git add Cargo.toml Cargo.lock CHANGELOG.md

      - name: Stage changelog
        if: ${{ steps.bump.outputs.released == 'true' && steps.bump.outputs.commit_changes == 'false' }}
        run: git add CHANGELOG.md

      - name: Commit release (verified)
        if: ${{ steps.bump.outputs.released == 'true' }}
        uses: qoomon/actions--create-commit@7102b1a8b3cb8716dc70dbeb6d774c375d779d2f # v1.2.5
        with:
          message: 'chore(release): ${{ steps.bump.outputs.tag }} [skip ci]'
          skip-empty: true

      - name: Push commit
        if: ${{ steps.bump.outputs.released == 'true' }}
        run: git push

      - name: Create tag
        if: ${{ steps.bump.outputs.released == 'true' }}
        uses: qoomon/actions--create-tag@bc18da911783e8dd24a7ae3ec1a95af941d29f60 # v1.0.0
        with:
          name: '${{ steps.bump.outputs.tag }}'
          message: '${{ steps.bump.outputs.tag }}'

      - name: Push tag
        if: ${{ steps.bump.outputs.released == 'true' }}
        run: git push origin 'refs/tags/${{ steps.bump.outputs.tag }}'

      - name: Upload release notes
        if: ${{ steps.bump.outputs.released == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md

  build-artifacts:
    name: Build binaries (${{ matrix.target }})
    needs: prepare-release
    if: ${{ needs.prepare-release.outputs.released == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-2025
            target: i686-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            build_cmd: cargo zigbuild
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            build_cmd: cargo zigbuild
          - os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            archive: tar.gz
            build_cmd: cargo zigbuild
          - os: ubuntu-22.04
            target: i686-unknown-linux-gnu
            archive: tar.gz
            build_cmd: cargo zigbuild
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Zig
        if: ${{ matrix.build_cmd == 'cargo zigbuild' }}
        run: pip install ziglang

      - name: Install cargo-zigbuild
        if: ${{ matrix.build_cmd == 'cargo zigbuild' }}
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-zigbuild

      - name: Build binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: ${{ matrix.build_cmd || 'cargo build' }} --release --locked --target ${{ matrix.target }} --bin ahe-ics --bin ahe-ics-shared

      - name: Package (tar.gz)
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for bin in ahe-ics ahe-ics-shared; do
            mkdir -p "dist/${bin}"
            tar -C "target/${TARGET}/release" -czf "dist/${bin}/${bin}-${TARGET}.tar.gz" "${bin}"
          done

      - name: Package (zip)
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          foreach ($bin in @("ahe-ics", "ahe-ics-shared")) {
            New-Item -ItemType Directory -Force "dist/$bin" | Out-Null
            Compress-Archive -Path "target/$env:TARGET/release/$bin.exe" -DestinationPath "dist/$bin/$bin-$env:TARGET.zip"
          }

      - name: Upload dedicated artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-ahe-ics-${{ matrix.target }}
          path: dist/ahe-ics/*

      - name: Upload shared artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-ahe-ics-shared-${{ matrix.target }}
          path: dist/ahe-ics-shared/*

  publish-release:
    name: Publish GitHub release
    needs:
      - prepare-release
      - build-artifacts
    if: ${{ needs.prepare-release.outputs.released == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*

      - name: Compute SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz *.zip | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: .

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          body_path: release-notes.md
          files: dist/*

  publish-docker:
    name: Publish image (${{ matrix.variant }})
    needs:
      - prepare-release
      - build-artifacts
    if: ${{ needs.prepare-release.outputs.released == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian
            dockerfile: Dockerfile.release
            bin_name: ahe-ics
            libc: gnu
            image_name: ahe-ics
            tag_suffix: ''
            latest_tag: latest
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
            title: 'ahe-ics'
            description: 'Self-hosted AHE Łódź class schedule exporter to iCalendar (ICS)'
          - variant: alpine
            dockerfile: Dockerfile.alpine.release
            bin_name: ahe-ics
            libc: musl
            image_name: ahe-ics
            tag_suffix: '-alpine'
            latest_tag: alpine
            platforms: linux/amd64,linux/arm64
            title: 'ahe-ics'
            description: 'Self-hosted AHE Łódź class schedule exporter to iCalendar (ICS)'
          - variant: shared-debian
            dockerfile: Dockerfile.release
            bin_name: ahe-ics-shared
            libc: gnu
            image_name: ahe-ics
            tag_suffix: '-shared'
            latest_tag: shared
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
            title: 'ahe-ics-shared'
            description: 'AHE Łódź class schedule exporter — stateless SaaS variant (credentials per request)'
          - variant: shared-alpine
            dockerfile: Dockerfile.alpine.release
            bin_name: ahe-ics-shared
            libc: musl
            image_name: ahe-ics
            tag_suffix: '-shared-alpine'
            latest_tag: shared-alpine
            platforms: linux/amd64,linux/arm64
            title: 'ahe-ics-shared'
            description: 'AHE Łódź class schedule exporter — stateless SaaS variant (credentials per request)'
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: binaries-${{ matrix.bin_name }}-*
          merge-multiple: true

      - name: Stage binaries into build context
        shell: bash
        env:
          BIN_NAME: ${{ matrix.bin_name }}
          LIBC: ${{ matrix.libc }}
          PLATFORMS: ${{ matrix.platforms }}
        run: bash scripts/stage-docker-binaries.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            BIN=${{ matrix.bin_name }}
            IMAGE_TITLE=${{ matrix.title }}
            IMAGE_DESCRIPTION=${{ matrix.description }}
          tags: ahe-ics-smoke:${{ matrix.variant }}

      - name: Smoke test image
        shell: bash
        env:
          IMAGE: ahe-ics-smoke:${{ matrix.variant }}
        run: bash scripts/smoke-test-image.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.version }}${{ matrix.tag_suffix }}
            type=raw,value=${{ matrix.latest_tag }}
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: |
            BIN=${{ matrix.bin_name }}
            IMAGE_TITLE=${{ matrix.title }}
            IMAGE_DESCRIPTION=${{ matrix.description }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
