name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile.release'
      - 'Dockerfile.alpine.release'
      - 'scripts/**'
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      commit_changes: ${{ steps.bump.outputs.commit_changes }}
      prerelease: ${{ steps.kind.outputs.kind == 'rc' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide release kind
        id: kind
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$EVENT" == push && "$MESSAGE" != *"[security]"* ]]; then
            echo "kind=rc" >>"$GITHUB_OUTPUT"
          else
            echo "kind=stable" >>"$GITHUB_OUTPUT"
          fi

      - name: Determine next version (git-cliff)
        id: cliff_bumped
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --bumped-version
        env:
          OUTPUT: bumped-version.txt
          GITHUB_REPO: ${{ github.repository }}

      - name: Detect user-facing changes (git-cliff)
        id: cliff_userfacing
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff-release.toml
          args: ${{ steps.kind.outputs.kind == 'rc' && format('{0}..{1}', github.event.before, github.sha) || '--unreleased' }} --context
        env:
          OUTPUT: user-facing.json
          GITHUB_REPO: ${{ github.repository }}

      - name: Count user-facing commits
        id: userfacing
        shell: bash
        run: |
          set -euo pipefail
          count=$(jq '[.[].commits[]] | length' user-facing.json)
          echo "User-facing commits since the last tag: $count"
          echo "count=$count" >>"$GITHUB_OUTPUT"

      - name: Install rust toolchain
        if: ${{ steps.userfacing.outputs.count != '0' && steps.kind.outputs.kind == 'stable' }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-edit
        if: ${{ steps.userfacing.outputs.count != '0' && steps.kind.outputs.kind == 'stable' }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-edit

      - name: Bump project version
        id: bump
        if: ${{ steps.userfacing.outputs.count != '0' }}
        shell: bash
        env:
          RELEASE_KIND: ${{ steps.kind.outputs.kind }}
          CLIFF_BUMPED_VERSION: ${{ steps.cliff_bumped.outputs.content }}
        run: bash scripts/bump-version.sh

      - name: Generate release notes (git-cliff)
        if: ${{ steps.bump.outputs.released == 'true' }}
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff-release.toml
          args: --unreleased --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate CHANGELOG.md (git-cliff)
        if: ${{ steps.bump.outputs.released == 'true' && steps.kind.outputs.kind == 'stable' }}
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Stage release files
        if: ${{ steps.bump.outputs.released == 'true' && steps.bump.outputs.commit_changes == 'true' }}
        run: git add Cargo.toml Cargo.lock CHANGELOG.md

      - name: Stage changelog
        if: ${{ steps.bump.outputs.released == 'true' && steps.bump.outputs.commit_changes == 'false' && steps.kind.outputs.kind == 'stable' }}
        run: git add CHANGELOG.md

      - name: Commit release (verified)
        if: ${{ steps.bump.outputs.released == 'true' && steps.kind.outputs.kind == 'stable' }}
        uses: qoomon/actions--create-commit@7102b1a8b3cb8716dc70dbeb6d774c375d779d2f # v1.2.5
        with:
          message: 'chore(release): ${{ steps.bump.outputs.tag }} [skip ci]'
          skip-empty: true

      - name: Push commit
        if: ${{ steps.bump.outputs.released == 'true' && steps.kind.outputs.kind == 'stable' }}
        run: git push

      - name: Create tag
        if: ${{ steps.bump.outputs.released == 'true' }}
        uses: qoomon/actions--create-tag@bc18da911783e8dd24a7ae3ec1a95af941d29f60 # v1.0.0
        with:
          name: '${{ steps.bump.outputs.tag }}'
          message: '${{ steps.bump.outputs.tag }}'

      - name: Push tag
        if: ${{ steps.bump.outputs.released == 'true' }}
        run: git push origin 'refs/tags/${{ steps.bump.outputs.tag }}'

      - name: Upload release notes
        if: ${{ steps.bump.outputs.released == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  build-artifacts:
    name: Build ${{ matrix.target }}
    needs: prepare-release
    if: ${{ needs.prepare-release.outputs.released == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15
            target: universal-apple-darwin
            archive: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-2025
            target: i686-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            build_cmd: cargo zigbuild
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            build_cmd: cargo zigbuild
          - os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            archive: tar.gz
            build_cmd: cargo zigbuild
          - os: ubuntu-22.04
            target: i686-unknown-linux-gnu
            archive: tar.gz
            build_cmd: cargo zigbuild
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Zig
        if: ${{ matrix.build_cmd == 'cargo zigbuild' }}
        run: pip install ziglang

      - name: Install cargo-zigbuild
        if: ${{ matrix.build_cmd == 'cargo zigbuild' }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild

      - name: Build binaries
        if: ${{ matrix.target != 'universal-apple-darwin' }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: ${{ matrix.build_cmd || 'cargo build' }} --release --locked --target ${{ matrix.target }} --bin ahe-ics --bin ahe-ics-shared

      - name: Build universal macOS binaries
        if: ${{ matrix.target == 'universal-apple-darwin' }}
        run: |
          set -euo pipefail
          for arch in aarch64 x86_64; do
            cargo build --release --locked --target "${arch}-apple-darwin" --bin ahe-ics --bin ahe-ics-shared
          done
          mkdir -p target/universal-apple-darwin/release
          for bin in ahe-ics ahe-ics-shared; do
            lipo -create -output "target/universal-apple-darwin/release/${bin}" \
              "target/aarch64-apple-darwin/release/${bin}" \
              "target/x86_64-apple-darwin/release/${bin}"
          done

      - name: Package (tar.gz)
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for bin in ahe-ics ahe-ics-shared; do
            mkdir -p "dist/${bin}"
            tar -C "target/${TARGET}/release" -czf "dist/${bin}/${bin}-${TARGET}.tar.gz" "${bin}"
          done

      - name: Package (zip)
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          foreach ($bin in @("ahe-ics", "ahe-ics-shared")) {
            New-Item -ItemType Directory -Force "dist/$bin" | Out-Null
            Compress-Archive -Path "target/$env:TARGET/release/$bin.exe" -DestinationPath "dist/$bin/$bin-$env:TARGET.zip"
          }

      - name: Upload dedicated artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-ahe-ics-${{ matrix.target }}
          path: dist/ahe-ics/*

      - name: Upload shared artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-ahe-ics-shared-${{ matrix.target }}
          path: dist/ahe-ics-shared/*

  publish-release:
    name: Release
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare-release.outputs.tag }}
    needs:
      - prepare-release
      - build-artifacts
    if: ${{ needs.prepare-release.outputs.released == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false
          path: source

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: source
          format: spdx-json
          output-file: dist/ahe-ics.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Compute SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz *.zip | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: .

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          body_path: release-notes.md
          files: dist/*
          prerelease: ${{ needs.prepare-release.outputs.prerelease }}
          draft: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          LATEST: ${{ needs.prepare-release.outputs.prerelease != 'true' }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$LATEST"

  publish-docker:
    name: Image ${{ matrix.variant }}
    environment:
      name: docker-hub
      deployment: false
    needs:
      - prepare-release
      - build-artifacts
    if: ${{ needs.prepare-release.outputs.released == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian
            dockerfile: Dockerfile.release
            bin_name: ahe-ics
            libc: gnu
            image_name: ahe-ics
            tag_suffix: ''
            latest_tag: latest
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
            title: 'ahe-ics'
            description: 'Self-hosted AHE Łódź class schedule exporter to iCalendar (ICS)'
          - variant: alpine
            dockerfile: Dockerfile.alpine.release
            bin_name: ahe-ics
            libc: musl
            image_name: ahe-ics
            tag_suffix: '-alpine'
            latest_tag: alpine
            platforms: linux/amd64,linux/arm64
            title: 'ahe-ics'
            description: 'Self-hosted AHE Łódź class schedule exporter to iCalendar (ICS)'
          - variant: shared-debian
            dockerfile: Dockerfile.release
            bin_name: ahe-ics-shared
            libc: gnu
            image_name: ahe-ics
            tag_suffix: '-shared'
            latest_tag: shared
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
            title: 'ahe-ics-shared'
            description: 'AHE Łódź class schedule exporter, stateless SaaS variant (credentials per request)'
          - variant: shared-alpine
            dockerfile: Dockerfile.alpine.release
            bin_name: ahe-ics-shared
            libc: musl
            image_name: ahe-ics
            tag_suffix: '-shared-alpine'
            latest_tag: shared-alpine
            platforms: linux/amd64,linux/arm64
            title: 'ahe-ics-shared'
            description: 'AHE Łódź class schedule exporter, stateless SaaS variant (credentials per request)'
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false

      - name: Download release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: binaries-${{ matrix.bin_name }}-*
          merge-multiple: true

      - name: Stage binaries into build context
        shell: bash
        env:
          BIN_NAME: ${{ matrix.bin_name }}
          LIBC: ${{ matrix.libc }}
          PLATFORMS: ${{ matrix.platforms }}
        run: bash scripts/stage-docker-binaries.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            BIN=${{ matrix.bin_name }}
            IMAGE_TITLE=${{ matrix.title }}
            IMAGE_DESCRIPTION=${{ matrix.description }}
          tags: ahe-ics-smoke:${{ matrix.variant }}
          cache-from: type=gha,scope=release-${{ matrix.variant }}
          cache-to: type=gha,scope=release-${{ matrix.variant }},mode=max

      - name: Smoke test image
        shell: bash
        env:
          IMAGE: ahe-ics-smoke:${{ matrix.variant }}
        run: bash scripts/smoke-test-image.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.version }}${{ matrix.tag_suffix }}
            type=raw,value=${{ matrix.latest_tag }},enable=${{ needs.prepare-release.outputs.prerelease != 'true' }}
            type=raw,value=next${{ matrix.tag_suffix }},enable=${{ needs.prepare-release.outputs.prerelease == 'true' }}
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: |
            BIN=${{ matrix.bin_name }}
            IMAGE_TITLE=${{ matrix.title }}
            IMAGE_DESCRIPTION=${{ matrix.description }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.variant }}
          cache-to: type=gha,scope=release-${{ matrix.variant }},mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
