services:
  ahe-ics-shared:
    image: wielorzeczownik/ahe-ics:shared
    container_name: ahe-ics-shared
    ports:
      - '8080:8080'
    environment:
      AHE_CAL_TOKEN: 'supersecret-token'
      # openssl rand -base64 32
      AHE_LINK_KEY: '${AHE_LINK_KEY:?set it in .env}'
      AHE_CAL_EXAMS_ENABLED: 'true'
    restart: unless-stopped
